name: Monthly title refresh

# Why this exists
# ---------------
# `lib/seo-title-optimizer.ts` injects the CURRENT month into titles via
# `new Date()` — e.g. "Aircond Service Ampang Jaya (Ampang) August 2026".
# 638 pages carry that stamp.
#
# Every page is statically prerendered and there is no ISR / `revalidate`
# anywhere, so that month is frozen at BUILD time. Without a scheduled
# rebuild, the site keeps advertising "August 2026" in November — a
# freshness tactic that inverts into a staleness signal for both Google
# (CTR loss) and AI answer engines (recency is a ranking input).
#
# This job redeploys on the 1st of each month so the stamp stays truthful.
#
# SETUP REQUIRED (one-off):
#   Vercel → Project → Settings → Git → Deploy Hooks → create a hook,
#   then add the URL as the repo secret VERCEL_DEPLOY_HOOK_URL
#   (GitHub → Settings → Secrets and variables → Actions).
# Until that secret exists the job exits cleanly with a notice rather
# than failing the Actions tab every month.

on:
  schedule:
    # 00:20 UTC on the 1st = 08:20 MYT — safely inside the new month in
    # Asia/Kuala_Lumpur, which is the timezone the titles are read in.
    - cron: "20 0 1 * *"
  workflow_dispatch: # allow a manual refresh after any copy change

# Never let two refresh deploys overlap.
concurrency:
  group: monthly-refresh
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel production rebuild
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK_URL is not set — skipping."
            echo "::notice::Create a Vercel deploy hook and add it as a repo secret to enable monthly title refresh."
            exit 0
          fi

          status=$(curl -sS -o /tmp/hook.log -w "%{http_code}" -X POST "$HOOK")
          echo "Vercel responded: HTTP $status"
          cat /tmp/hook.log || true

          # Deploy hooks return 201 Created (sometimes 200) on success.
          if [ "$status" != "201" ] && [ "$status" != "200" ]; then
            echo "::error::Vercel deploy hook failed with HTTP $status"
            exit 1
          fi
          echo "::notice::Monthly rebuild triggered — month-stamped titles refreshed."
