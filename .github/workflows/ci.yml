name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same branch — this build is slow (2,100+
# static pages), so queuing duplicates wastes a lot of runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        # Runs here rather than inside `next build` (see next.config.mjs).
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify site-public.ts is in sync
        # config/site-public.ts is generated from config/site.ts. If someone
        # edits site.ts (phone, pricing, services, area names) without
        # regenerating, the client-side copy silently goes stale.
        run: |
          npm run gen:site-public
          if ! git diff --quiet -- config/site-public.ts; then
            echo "::error file=config/site-public.ts::config/site-public.ts is out of date. Run 'npm run gen:site-public' and commit the result."
            git diff -- config/site-public.ts
            exit 1
          fi

      - name: Build
        # The full static export needs more than Node's default heap.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Verify build output
        # Guards the regressions this repo has actually had: giant client
        # chunks, sitemap URLs with no page, missing/duplicate <h1>.
        run: npm run verify:build

      - name: Search Console audit
        # Fails on anything Google would report as an indexing error:
        # canonical pointing elsewhere, noindex in sitemap, internal 404s,
        # hreflang without return tags, near-duplicate page families,
        # self-serving review markup.
        run: npm run audit:gsc

      - name: Ping IndexNow (Bing / Yandex)
        # Tells IndexNow-engines about the freshly deployed URLs (all ~2.2k
        # canonicals + hreflang alternates, per app/api/indexnow). Only for
        # production pushes. Skips cleanly when the secret is not configured.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_TRIGGER_SECRET }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::notice::INDEXNOW_TRIGGER_SECRET is not set — skipping IndexNow ping."
            exit 0
          fi
          status=$(curl -sS -o /tmp/indexnow.log -w "%{http_code}" "https://www.klrenovator.com/api/indexnow?key=${INDEXNOW_KEY}")
          echo "IndexNow endpoint responded: HTTP $status"
          cat /tmp/indexnow.log || true
          if [ "$status" != "200" ]; then
            echo "::warning::IndexNow ping returned HTTP $status — check INDEXNOW_TRIGGER_SECRET in Vercel and GitHub."
          fi
